# PO & Contract Match — Nginx site on the RPA server (EC2 13.207.66.222).
# Installed by the deploy workflow as C:\nginx\nginx-1.30.0\conf\conf.d\po-contract.conf
#
#   :8091/        -> built React frontend (frontend\dist)
#   :8091/api/... -> FastAPI backend on 127.0.0.1:8210 (the /api prefix is stripped)
#
# In the app's Settings, the API base URL is http://13.207.66.222:8091/api

server {
    listen      8091;
    server_name _;

    # PO + contract PDFs are uploaded together.
    client_max_body_size 25m;

    root  E:/POContract/app/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8210/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /validate runs the LLM extraction + validation crews and the SAP
        # lookup in one request; it can take several minutes.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
